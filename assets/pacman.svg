<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 80" width="100%" height="80">
  <style>
    .bg { fill: #0a0804; rx: 12px; stroke: rgba(255, 184, 0, 0.25); stroke-width: 1px; }
    .tagline { fill: rgba(255, 184, 0, 0.7); font-family: 'JetBrains Mono', monospace, -apple-system, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; }
    .dot { fill: rgba(255, 184, 0, 0.35); }
    .pacman-top, .pacman-bottom {
      fill: #ffb800;
      filter: drop-shadow(0 0 8px rgba(255, 184, 0, 0.9));
    }
    @keyframes chompTop {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(-35deg); }
    }
    @keyframes chompBottom {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(35deg); }
    }
    @keyframes walkPacman {
      0% { transform: translate(-30px, 0); }
      100% { transform: translate(750px, 0); }
    }
    .pacman-group {
      animation: walkPacman 10s linear infinite;
    }
    .p-top {
      transform-origin: 10px 10px;
      animation: chompTop 0.22s ease-in-out infinite alternate;
    }
    .p-bottom {
      transform-origin: 10px 10px;
      animation: chompBottom 0.22s ease-in-out infinite alternate;
    }
  </style>

  <rect width="840" height="80" class="bg" />
  
  <text x="25" y="45" class="tagline">4U.IA.BR</text>

  <!-- Dots Track -->
